name: CI

# Guards the release pipeline: publish-npm.yml runs `bun install --frozen-lockfile`,
# so a pull request that changes package.json without refreshing bun.lock breaks the
# npm publish only after the tag has already been pushed. Catch it on the pull request.
#
# The definition of "green" lives in .github/scripts/ci.sh and is shared with the
# automation workflows (update-omp, weekly-release, opencode-agent).
#
# workflow_dispatch exists because branches pushed by GITHUB_TOKEN (bot PRs) do not
# trigger pull_request/push workflows; the automation dispatches CI on them instead.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # engines.bun requires >=1.3.14: the omp SDK ships TypeScript that
          # imports `bun:` builtins, so an older Bun cannot serve the API routes.
          bun-version: "1.4.2"

      - name: Install, typecheck, lint, test, build
        run: bash .github/scripts/ci.sh
